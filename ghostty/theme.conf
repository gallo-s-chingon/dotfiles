# This is a template file for Ghostty.
# Control your transparency with the `background-opacity` setting below.
# 1.0 is fully opaque, 0.0 is fully transparent.
background-opacity = 0.8
background-blur-radius = 10 

# Font settings
font-family = "MesloLGL Nerd Font"
font-size = 20

# Colors - These are replaced by the script
background = #00041F
foreground = #FFEBF7
cursor-color = #FFB3FF
selection-background = #2d4f67
selection-foreground = #c8c093

# Terminal Colors (ANSI)
palette = 0=#2C3F90
palette = 1=#FF4D9D
palette = 2=#3BEE8A
palette = 3=#FFC07A
palette = 4=#B79CFF
palette = 5=#FF82E6
palette = 6=#57E6FF
palette = 7=#FFEBF7
palette = 8=#2C3F90
palette = 9=#FF75B5
palette = 10=#67F5A4
palette = 11=#FFD0A0
palette = 12=#C8B3FF
palette = 13=#FFB3FF
palette = 14=#84F0FF
palette = 15=#FFFFFF
