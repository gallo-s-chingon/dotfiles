# This is a template file for Ghostty.
# Control your transparency with the `background-opacity` setting below.
# 1.0 is fully opaque, 0.0 is fully transparent.
background-opacity = 0.8
background-blur-radius = 10 

# Font settings
font-family = "MesloLGL Nerd Font"
font-size = 20

# Colors - These are replaced by the script
background = #000C00
foreground = #DAEFDF
cursor-color = #8ED3BA
selection-background = #2d4f67
selection-foreground = #c8c093

# Terminal Colors (ANSI)
palette = 0=#0A0D0A
